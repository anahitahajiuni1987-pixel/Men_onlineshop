<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>پنل ادمین | مارک</title>
  <style>
    :root{--ink:#18181a;--muted:#777169;--paper:#e9e4dc;--line:rgba(25,24,22,.12);--green:#416e49;--red:#924b41;--gold:#866f25;--sans:"Vazirmatn","Noto Sans Arabic",Tahoma,system-ui,sans-serif}*{box-sizing:border-box;margin:0;padding:0}html,body{overflow-x:hidden}body{min-height:100vh;background:radial-gradient(circle at 85% 0%,rgba(255,255,255,.78),transparent 35%),var(--paper);color:var(--ink);font-family:var(--sans)}button,input,select{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}.page{width:100%;max-width:1180px;margin:auto;padding:25px 22px 64px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{display:flex;align-items:center;gap:10px}.brand-mark{width:28px;height:28px;border-radius:9px 9px 9px 3px;background:#151518;transform:rotate(-14deg);position:relative}.brand-mark:after{content:"";position:absolute;inset:6px 7px;background:#efebe5;border-radius:5px 5px 5px 1px}.brand-name{font-size:21px;font-weight:900;letter-spacing:-.08em}.brand-sub{display:block;color:var(--muted);font-size:10px;margin-top:-4px}.back,.logout{border:1px solid var(--line);border-radius:999px;padding:10px 15px;color:#69635b;background:transparent;font-size:11px}.title{padding:62px 0 27px}.eyebrow{color:#8b8378;font-size:11px;letter-spacing:.1em}.title h1{font-size:clamp(40px,6vw,68px);line-height:1;letter-spacing:-.08em;margin-top:13px}.panel{border:1px solid rgba(255,255,255,.72);background:linear-gradient(145deg,rgba(255,255,255,.64),rgba(205,198,187,.4));border-radius:25px;padding:21px;box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 20px 45px -30px rgba(45,35,25,.45)}.login{max-width:480px;margin-right:0}.panel h2{font-size:18px;margin-bottom:10px}.lead{color:var(--muted);font-size:12px;line-height:2;margin-bottom:20px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}.field label{font-size:11px;color:#6f685f}.field input,.field select{height:44px;width:100%;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.55);padding:0 12px;color:var(--ink);outline:none}.field input:focus,.field select:focus{border-color:#6f6a62;box-shadow:0 0 0 3px rgba(0,0,0,.05)}.primary{width:100%;height:47px;border:0;border-radius:13px;background:#19191b;color:#fff;font-size:12px;font-weight:700}.primary:hover{background:#343438}.notice{font-size:11px;line-height:1.9;color:var(--muted);margin-top:14px}.alert{display:none;border-radius:12px;padding:12px 14px;font-size:12px;margin-bottom:14px}.alert.show{display:block}.alert.error{background:rgba(180,75,60,.12);color:var(--red)}.alert.ok{background:rgba(74,127,83,.13);color:var(--green)}.dashboard{display:none}.dashboard.show{display:block}.toolbar{display:flex;align-items:end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:19px}.filters{display:flex;gap:10px;align-items:end;flex:1}.filters .field{margin:0;min-width:170px;flex:1}.filters .field:first-child{flex:1.6}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.stat{padding:17px 18px;border:1px solid var(--line);border-radius:17px;background:rgba(255,255,255,.29)}.stat span{font-size:11px;color:var(--muted)}.stat strong{display:block;font-size:27px;margin-top:7px}.orders{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.order{min-width:0}.order-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line)}.order-code{font-size:12px;font-weight:800;direction:ltr;text-align:right;word-break:break-all}.date{color:var(--muted);font-size:10px;margin-top:5px}.status{font-size:10px;padding:7px 9px;border-radius:999px;background:rgba(183,150,54,.17);color:var(--gold);white-space:nowrap}.status.paid,.status.completed{background:rgba(74,127,83,.14);color:var(--green)}.status.failed,.status.cancelled,.status.checkout_failed{background:rgba(180,75,60,.13);color:var(--red)}.order-meta{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:15px 0;color:#6e675e;font-size:11px;line-height:1.8}.order-meta strong{display:block;color:var(--ink);font-size:12px}.items{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:13px}.item{display:flex;justify-content:space-between;gap:12px;color:#6e675e;font-size:11px}.item strong{color:var(--ink);white-space:nowrap}.order-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);margin-top:14px;padding-top:14px}.order-total{font-size:11px;color:var(--muted)}.order-total strong{display:block;color:var(--ink);font-size:19px;margin-top:3px}.status-edit{display:flex;gap:7px;align-items:center}.status-edit select{height:36px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.55);padding:0 7px;font-size:10px;color:var(--ink)}.save{height:36px;border:0;border-radius:10px;padding:0 12px;background:#19191b;color:#fff;font-size:10px}.save:disabled{opacity:.5}.empty,.loading{text-align:center;color:var(--muted);padding:48px 20px;font-size:12px}.loading{grid-column:1/-1}.small-note{color:var(--muted);font-size:10px;margin-top:7px}@media(max-width:800px){.page{padding:18px 14px 44px}.title{padding:52px 0 28px}.stats{grid-template-columns:repeat(2,1fr)}.orders{grid-template-columns:1fr}.filters{width:100%;flex-direction:column;align-items:stretch}.filters .field{width:100%}.toolbar .primary{width:100%}}@media(max-width:450px){.topbar .back{font-size:10px;padding:9px 11px}.stats{gap:8px}.stat{padding:13px}.stat strong{font-size:23px}.order-meta{grid-template-columns:1fr}.order-footer{align-items:flex-start;flex-direction:column}.status-edit{width:100%}.status-edit select,.status-edit .save{flex:1}}
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span><span class="brand-name">مارک</span><span class="brand-sub">پوشاک مردانه</span></span></a><a class="back" href="/">بازگشت به سایت</a></header>
    <section class="title"><span class="eyebrow">MARK / ADMIN CONSOLE</span><h1>پنل ادمین</h1></section>
    <section id="login" class="panel login"><h2>ورود مدیر</h2><p class="lead">برای مشاهده و مدیریت سفارش‌ها، توکن ادمین را وارد کنید.</p><div id="loginAlert" class="alert"></div><form id="loginForm"><div class="field"><label for="token">توکن دسترسی ادمین</label><input id="token" type="password" autocomplete="off" required placeholder="ADMIN_PANEL_TOKEN" /></div><button class="primary" type="submit">ورود به پنل</button></form><p class="notice">توکن فقط در session همین مرورگر نگهداری می‌شود و داخل کد سایت یا GitHub ذخیره نمی‌شود.</p></section>
    <section id="dashboard" class="dashboard">
      <div id="dashAlert" class="alert"></div>
      <div class="toolbar"><div class="filters"><div class="field"><label for="search">جست‌وجوی سفارش</label><input id="search" placeholder="شناسه، نام یا ایمیل مشتری" /></div><div class="field"><label for="statusFilter">وضعیت</label><select id="statusFilter"><option value="all">همه وضعیت‌ها</option><option value="pending">در انتظار پرداخت</option><option value="paid">پرداخت موفق</option><option value="preparing">در حال آماده‌سازی</option><option value="shipped">ارسال‌شده</option><option value="completed">تکمیل‌شده</option><option value="cancelled">لغوشده</option><option value="failed">پرداخت ناموفق</option></select></div></div><button id="refresh" class="primary" type="button">به‌روزرسانی سفارش‌ها</button><button id="logout" class="logout" type="button">خروج</button></div>
      <div class="stats"><div class="stat"><span>کل سفارش‌ها</span><strong id="countAll">۰</strong></div><div class="stat"><span>در انتظار پرداخت</span><strong id="countPending">۰</strong></div><div class="stat"><span>پرداخت موفق</span><strong id="countPaid">۰</strong></div><div class="stat"><span>ارسال‌شده</span><strong id="countShipped">۰</strong></div></div>
      <div id="orders" class="orders"></div>
    </section>
  </div>
  <script>
    const $=s=>document.querySelector(s), login=$('#login'),dashboard=$('#dashboard'),loginAlert=$('#loginAlert'),dashAlert=$('#dashAlert'),statusLabels={pending:'در انتظار پرداخت',paid:'پرداخت موفق',preparing:'در حال آماده‌سازی',shipped:'ارسال‌شده',completed:'تکمیل‌شده',cancelled:'لغوشده',failed:'پرداخت ناموفق',checkout_failed:'خطا در پرداخت'},tokenKey='mark-admin-token';
    let token=sessionStorage.getItem(tokenKey)||'',orders=[];
    const esc=value=>String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    const money=value=>`$${Number(value).toFixed(2)}`;
    function alertBox(el,text,kind='error'){el.textContent=text;el.className=`alert show ${kind}`}
    function statusClass(status){return ['paid','completed','failed','cancelled','checkout_failed'].includes(status)?status:''}
    function renderStats(){const fa=n=>Number(n).toLocaleString('fa-IR');$('#countAll').textContent=fa(orders.length);$('#countPending').textContent=fa(orders.filter(o=>o.status==='pending').length);$('#countPaid').textContent=fa(orders.filter(o=>o.status==='paid').length);$('#countShipped').textContent=fa(orders.filter(o=>o.status==='shipped').length)}
    function renderOrders(){const box=$('#orders');renderStats();if(!orders.length){box.innerHTML='<div class="panel empty">سفارشی با این فیلتر پیدا نشد.</div>';return}box.innerHTML=orders.map(order=>`<article class="panel order" data-id="${esc(order.id)}"><div class="order-head"><div><div class="order-code">${esc(order.id)}</div><div class="date">${new Date(order.created_at).toLocaleString('fa-IR')}</div></div><span class="status ${statusClass(order.status)}">${esc(statusLabels[order.status]||order.status)}</span></div><div class="order-meta"><div>مشتری<strong>${esc(order.customer_name)}<br>${esc(order.customer_email)}</strong></div><div>ارسال<strong>${esc(order.shippingAddress?.city||'—')} · ${esc(order.shippingAddress?.postalCode||'—')}<br>${esc(order.shippingAddress?.address||'—')}</strong></div></div><div class="items">${(order.items||[]).map(item=>`<div class="item"><span>${esc(item.name)} × ${esc(item.quantity)} · ${esc(item.color)} / ${esc(item.size)}</span><strong>${money(item.price*item.quantity)}</strong></div>`).join('')}</div><div class="order-footer"><div class="order-total">مبلغ نهایی<strong>${money(order.total)}</strong></div><div class="status-edit"><select class="status-select" aria-label="تغییر وضعیت">${Object.entries(statusLabels).map(([value,label])=>`<option value="${value}" ${value===order.status?'selected':''}>${label}</option>`).join('')}</select><button class="save" type="button">ذخیره وضعیت</button></div></div></article>`).join('');box.querySelectorAll('.save').forEach(button=>button.addEventListener('click',()=>updateStatus(button)))}
    async function api(path,options={}){const response=await fetch(path,{...options,headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json',...(options.headers||{})}});const data=await response.json().catch(()=>({error:'پاسخ نامعتبر از سرور'}));if(!response.ok)throw new Error(data.error||'درخواست ناموفق بود');return data}
    async function load(){try{const params=new URLSearchParams({status:$('#statusFilter').value,q:$('#search').value.trim()});const data=await api('/api/admin/orders?'+params);orders=data.orders||[];renderOrders();dashAlert.className='alert';}catch(error){if(error.message.includes('توکن')){sessionStorage.removeItem(tokenKey);token='';dashboard.classList.remove('show');login.style.display='block';}alertBox(dashAlert,error.message)}}
    async function updateStatus(button){const card=button.closest('.order');const id=card.dataset.id;const status=card.querySelector('.status-select').value;button.disabled=true;try{const data=await api('/api/admin/orders/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({status})});const index=orders.findIndex(order=>order.id===id);if(index>=0)orders[index]=data.order;renderOrders();alertBox(dashAlert,'وضعیت سفارش با موفقیت به‌روزرسانی شد.','ok')}catch(error){alertBox(dashAlert,error.message)}finally{button.disabled=false}}
    function openDashboard(){login.style.display='none';dashboard.classList.add('show');load()}
    $('#loginForm').addEventListener('submit',e=>{e.preventDefault();token=$('#token').value.trim();sessionStorage.setItem(tokenKey,token);openDashboard()});$('#refresh').addEventListener('click',load);$('#statusFilter').addEventListener('change',load);let searchTimer;$('#search').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(load,250)});$('#logout').addEventListener('click',()=>{sessionStorage.removeItem(tokenKey);token='';dashboard.classList.remove('show');login.style.display='block';$('#token').value=''});if(token)openDashboard();
  </script>
</body>
</html>
