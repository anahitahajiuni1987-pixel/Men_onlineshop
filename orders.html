<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>سفارش‌های من | مارک</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root{--ink:#18181a;--muted:#777169;--paper:#e9e4dc;--line:rgba(25,24,22,.12);--sans:"Vazirmatn","Inter",system-ui,sans-serif}*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;background:radial-gradient(circle at 85% 0%,rgba(255,255,255,.75),transparent 36%),var(--paper);color:var(--ink);font-family:var(--sans)}a{text-decoration:none;color:inherit}.page{max-width:920px;margin:auto;padding:26px 22px 60px}.topbar{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:10px}.brand-mark{width:28px;height:28px;border-radius:9px 9px 9px 3px;background:#151518;transform:rotate(-14deg);position:relative}.brand-mark:after{content:"";position:absolute;inset:6px 7px;background:#efebe5;border-radius:5px 5px 5px 1px}.brand-name{font-size:21px;font-weight:900;letter-spacing:-.08em}.brand-sub{display:block;color:var(--muted);font-size:10px;margin-top:-4px}.back{font-size:12px;color:#69635b;border:1px solid var(--line);border-radius:999px;padding:10px 15px}.title{padding:72px 0 30px}.eyebrow{color:#8b8378;font-size:11px;letter-spacing:.1em}.title h1{font-size:clamp(42px,7vw,72px);line-height:1;letter-spacing:-.08em;margin-top:14px}.panel{border:1px solid rgba(255,255,255,.7);background:linear-gradient(145deg,rgba(255,255,255,.62),rgba(205,198,187,.4));border-radius:25px;padding:19px;box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 20px 45px -30px rgba(45,35,25,.45)}.order{margin-bottom:14px}.order-head{display:flex;align-items:start;justify-content:space-between;gap:16px;padding-bottom:14px;border-bottom:1px solid var(--line)}.order-id{font-size:13px;font-weight:700}.date{font-size:10px;color:var(--muted);margin-top:5px}.status{font-size:10px;padding:7px 10px;border-radius:999px;background:rgba(183,150,54,.17);color:#866f25}.status.paid{background:rgba(74,127,83,.14);color:#416e49}.status.failed{background:rgba(180,75,60,.13);color:#924b41}.items{padding:14px 0 0;display:flex;flex-direction:column;gap:9px}.item{display:flex;justify-content:space-between;gap:14px;font-size:11px;color:#6e675e}.item strong{color:var(--ink);font-weight:600}.order-total{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:14px;margin-top:14px;font-size:13px}.order-total strong{font-size:18px}.empty{text-align:center;padding:75px 20px;color:var(--muted)}.empty h2{color:var(--ink);font-size:21px;margin-bottom:10px}.empty a{display:inline-block;color:#fff;background:#19191b;border-radius:999px;padding:12px 18px;margin-top:20px;font-size:12px}.loading{text-align:center;color:var(--muted);font-size:12px;padding:40px}.error{color:#924b41;font-size:12px;text-align:center;padding:30px}@media(max-width:600px){.page{padding:18px 14px 42px}.title{padding:52px 0 27px}.order-head{align-items:center}.order-id{font-size:12px}}
  </style>
</head>
<body><div class="page"><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span><span class="brand-name">مارک</span><span class="brand-sub">پوشاک مردانه</span></span></a><a class="back" href="/account">پنل مشتری</a></header><section class="title"><span class="eyebrow">MARK / ORDER HISTORY</span><h1>سفارش‌های من</h1></section><main id="app" class="loading">در حال دریافت سفارش‌ها…</main></div><script src="/cart.js"></script><script>
const app=document.querySelector('#app');const ids=JSON.parse(localStorage.getItem('mark-order-ids')||'[]');const emails=JSON.parse(localStorage.getItem('mark-order-emails')||'{}');const faStatus={paid:['پرداخت موفق','paid'],pending:['در انتظار پرداخت',''],checkout_failed:['خطا در پرداخت','failed'],failed:['پرداخت ناموفق','failed']};function money(n){return `$${Number(n).toFixed(2)}`}async function load(){if(!ids.length){app.className='panel empty';app.innerHTML='<h2>هنوز سفارشی ثبت نکرده‌اید</h2><p>اولین انتخابت را از مجموعه مارک شروع کن.</p><a href="/products">مشاهده محصولات</a>';return}try{const results=await Promise.all(ids.map(id=>emails[id]?fetch('/api/orders/'+encodeURIComponent(id)+'?email='+encodeURIComponent(emails[id])).then(response=>response.ok?response.json():null):Promise.resolve(null)));const orders=results.filter(Boolean).map(result=>result.order);if(!orders.length)throw new Error('empty');app.className='';app.innerHTML=orders.map(order=>{const status=faStatus[order.status]||['در حال بررسی',''];return `<article class="panel order"><div class="order-head"><div><div class="order-id">سفارش ${order.id.slice(0,8).toUpperCase()}</div><div class="date">${new Date(order.created_at).toLocaleDateString('fa-IR')}</div></div><span class="status ${status[1]}">${status[0]}</span></div><div class="items">${order.items.map(item=>`<div class="item"><span>${item.name} × ${item.quantity} · ${item.color} / ${item.size}</span><strong>${money(item.price*item.quantity)}</strong></div>`).join('')}</div><div class="order-total"><span>مبلغ نهایی</span><strong>${money(order.total)}</strong></div></article>`}).join('')}catch{app.className='error';app.textContent='دریافت سفارش‌ها ممکن نشد؛ دوباره تلاش کنید.'}}load();
</script></body></html>
