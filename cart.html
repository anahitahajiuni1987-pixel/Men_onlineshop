<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>سبد خرید | مارک</title>
  <style>
    :root{--ink:#18181a;--muted:#777169;--paper:#e9e4dc;--line:rgba(25,24,22,.12);--garm:url("/assets/garments.webp");--sans:"Vazirmatn","Inter",system-ui,sans-serif}*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;background:radial-gradient(circle at 85% 0%,rgba(255,255,255,.75),transparent 36%),var(--paper);color:var(--ink);font-family:var(--sans)}a{text-decoration:none;color:inherit}button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}.page{max-width:1000px;margin:auto;padding:26px 22px 60px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{display:flex;align-items:center;gap:10px}.brand-mark{width:28px;height:28px;border-radius:9px 9px 9px 3px;background:#151518;transform:rotate(-14deg);position:relative}.brand-mark:after{content:"";position:absolute;inset:6px 7px;background:#efebe5;border-radius:5px 5px 5px 1px}.brand-name{font-size:21px;font-weight:900;letter-spacing:-.08em}.brand-sub{display:block;color:var(--muted);font-size:10px;margin-top:-4px}.back{font-size:12px;color:#69635b;border:1px solid var(--line);border-radius:999px;padding:10px 15px}.title{padding:72px 0 32px}.eyebrow{color:#8b8378;font-size:11px;letter-spacing:.1em}.title h1{font-size:clamp(42px,7vw,72px);line-height:1;letter-spacing:-.08em;margin-top:14px}.layout{display:grid;grid-template-columns:1.35fr .8fr;gap:20px;align-items:start}.panel{border:1px solid rgba(255,255,255,.7);background:linear-gradient(145deg,rgba(255,255,255,.62),rgba(205,198,187,.4));border-radius:25px;padding:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 20px 45px -30px rgba(45,35,25,.45)}.cart-item{display:grid;grid-template-columns:82px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.cart-item:last-child{border-bottom:0}.thumb{width:82px;height:92px;border-radius:16px;background:rgba(255,255,255,.38);overflow:hidden}.garment{height:100%;background-image:var(--garm);background-size:320% 212.5%;background-repeat:no-repeat;filter:drop-shadow(0 9px 9px rgba(40,30,20,.17))}.item-name{font-size:15px;font-weight:700}.item-meta{font-size:11px;color:var(--muted);margin-top:6px}.qty{display:flex;align-items:center;gap:9px;margin-top:11px}.qty button{width:25px;height:25px;border-radius:50%;background:rgba(255,255,255,.55);font-size:15px;line-height:1}.qty span{font-size:12px;min-width:12px;text-align:center}.item-price{font-size:15px;font-weight:800;white-space:nowrap}.remove{font-size:10px;color:#9a4d43;margin-top:10px}.summary-title{font-weight:700;font-size:16px;margin-bottom:17px}.row{display:flex;justify-content:space-between;gap:14px;color:#676159;font-size:12px;margin:13px 0}.row strong{color:var(--ink);font-size:13px}.total{border-top:1px solid var(--line);padding-top:17px;margin-top:18px;font-size:15px;color:var(--ink)}.total strong{font-size:22px}.checkout{display:flex;align-items:center;justify-content:center;width:100%;height:48px;border-radius:15px;background:#19191b;color:#fff;font-size:13px;font-weight:700;margin-top:22px;transition:transform .25s,background .25s}.checkout:hover{background:#35353a;transform:translateY(-2px)}.continue{display:block;text-align:center;color:#777169;font-size:11px;margin-top:15px}.empty{padding:70px 20px;text-align:center;color:#777169}.empty h2{color:var(--ink);font-size:21px;margin-bottom:10px}.empty a{display:inline-block;color:#fff;background:#19191b;border-radius:999px;padding:12px 18px;margin-top:20px;font-size:12px}.count{font-size:11px;color:var(--muted);margin-right:5px}.history{display:block;text-align:center;color:#777169;font-size:11px;margin-top:19px}@media(max-width:760px){.page{padding:18px 14px 42px}.title{padding:52px 0 25px}.layout{grid-template-columns:1fr}.summary{order:-1}.cart-item{grid-template-columns:68px 1fr auto}.thumb{width:68px;height:78px}.item-name{font-size:13px}.item-price{font-size:13px}}
  </style>
</head>
<body><div class="page"><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span><span class="brand-name">مارک</span><span class="brand-sub">پوشاک مردانه</span></span></a><a class="back" href="/products">بازگشت به محصولات</a></header><section class="title"><span class="eyebrow">MARK / SHOPPING BAG</span><h1>سبد خرید <span class="count" data-cart-count></span></h1></section><main id="app"></main></div><script src="/cart.js"></script><script>
const app=document.querySelector('#app');
function money(n){return `$${Number(n).toFixed(2)}`}
function render(){const entries=markReadCart().map(item=>({...item,product:MARK_PRODUCTS.find(p=>p.id===item.id)})).filter(item=>item.product);if(!entries.length){app.innerHTML='<section class="panel empty"><h2>سبد شما خالی است</h2><p>چند لباس ساده برای روزهای بهتر انتخاب کنید.</p><a href="/products">مشاهده محصولات</a></section>';return}const subtotal=entries.reduce((sum,item)=>sum+item.product.price*item.quantity,0);const shipping=subtotal>=150?0:9.9;const total=subtotal+shipping;app.innerHTML=`<div class="layout"><section class="panel"><div>${entries.map(item=>{const pos=MARK_GARMENT_POS[item.id];return `<article class="cart-item"><div class="thumb"><div class="garment" style="background-position:${pos[0]}% ${pos[1]}%"></div></div><div><div class="item-name">${item.product.name}</div><div class="item-meta">رنگ: ${item.color} · سایز: ${item.size}</div><div class="qty"><button data-action="dec" data-key="${item.key}">−</button><span>${item.quantity}</span><button data-action="inc" data-key="${item.key}">+</button></div><button class="remove" data-action="remove" data-key="${item.key}">حذف از سبد</button></div><div class="item-price">${money(item.product.price*item.quantity)}</div></article>`}).join('')}</div></section><aside class="panel summary"><h2 class="summary-title">خلاصه سفارش</h2><div class="row"><span>جمع محصولات</span><strong>${money(subtotal)}</strong></div><div class="row"><span>ارسال استاندارد</span><strong>${shipping?money(shipping):'رایگان'}</strong></div><div class="row total"><span>مبلغ نهایی</span><strong>${money(total)}</strong></div><a class="checkout" href="/checkout">ادامه و پرداخت</a><a class="continue" href="/products">ادامه خرید</a><a class="history" href="/orders">مشاهده سفارش‌های من</a></aside></div>`}
app.addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(!button)return;const key=button.dataset.key;if(button.dataset.action==='remove')markRemoveFromCart(key);else{const item=markReadCart().find(x=>x.key===key);if(item)markUpdateQuantity(key,item.quantity+(button.dataset.action==='inc'?1:-1))}render()});window.addEventListener('mark-cart-updated',render);render();
</script></body></html>
