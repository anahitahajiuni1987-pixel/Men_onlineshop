    function productIndex(){return mod(Math.round(target),5)}
    function makeCards(){arc.innerHTML='';cards.length=0;for(let i=0;i<10;i++){const item=ITEMS[i%5],card=document.createElement('article');card.className='card glass';card.dataset.index=i;card.innerHTML='<div class="g"></div><div class="card-copy"><div class="card-name"></div><div class="card-price"></div></div><div class="sheen"></div>';$('.g',card).style.backgroundPosition=`${item.g[0]}% ${item.g[1]}%`;$('.card-name',card).textContent=item.n;$('.card-price',card).textContent='$'+item.p;card.addEventListener('pointerenter',()=>{card.classList.remove('sheen-on');void card.offsetWidth;card.classList.add('sheen-on');setCursor('try')});card.addEventListener('pointerleave',()=>{if(!dragging)setCursor('drag')});card.addEventListener('click',e=>{if(Math.abs(dx)<6){const k=+card.dataset.index;target+=Math.round((k-target)/5)*5+(k-mod(Math.round(target),5));target=k;}});arc.append(card);cards.push(card)}}
    function updateCards(t){const H=getCW()*1.42,ie=1-Math.pow(1-intro,3);for(let i=0;i<cards.length;i++){const card=cards[i],u=mod(i-pos+5,10)-5,a=Math.abs(u),sg=Math.sign(u)||1;let s,z,op,ry,blur=0;if(a<1){s=.55+.45*a;z=-260*(1-a);op=a;ry=-sg*16*a}else{s=1/(1+.3*Math.pow(a-1,1.15));z=-110*(a-1);ry=-sg*(16+9*Math.min(2,a-1));blur=Math.max(0,a-1.6)*2.4}if(a>3.4)op=1-(a-3.4)/.8;const bob=prefersReduced?0:Math.sin(t*1.1+i*.73)*H*.006*Math.min(1,a),y=bob-(1-s)*H*.04;card.style.left=(-getCW()/2)+'px';card.style.top=(-(getCW()*1.42)/2)+'px';card.style.height=(getCW()*1.42)+'px';ry+=sx*10;card.style.transform=`translate(${sg*xAt(a)*ie}px,${y}px) perspective(1300px) translateZ(${z}px) rotateY(${ry}deg) rotateX(${-sy*6}deg) scale(${s*(.6+.4*ie)})`;card.style.opacity=Math.max(0,op*ie);card.style.filter=`blur(${blur}px)`;card.style.zIndex=a<1?1:Math.round(100-10*a);card.style.visibility=op*ie<.01?'hidden':'visible'}room.style.transform=`translate3d(${-sx*22}px,${-sy*14}px,0) scale(${1.08-.03*ie})`;ghost.style.transform=`translate(calc(-50% + ${-sx*40}px),${-sy*16}px)`;ghost.querySelectorAll('span').forEach((el,i)=>el.style.transform=`translateY(${(1-ie)*(60+30*i)}px)`);intro=Math.min(1,intro+(prefersReduced?1:.012))}
    function frame(now){const t=now/1000;if(!dragging){pos=prefersReduced?target:pos+(target-pos)*.11;if(Math.abs(target-pos)<.02&&mod(Math.round(target),5)!==shown)tryOn(productIndex())}else pos+=0;updateCards(t);sx+=(tx-innerWidth/2)/innerWidth*.5-sx*.06;sy+=(ty-innerHeight/2)/innerHeight*.5-sy*.06;raf=requestAnimationFrame(frame)}
    function setModel(item){$('#mNext').style.backgroundPositionX=item.m+'%';$('#mCur').style.backgroundPositionX=item.m+'%'}
    function roll(el,text){const old=el.querySelector('span');const next=document.createElement('span');next.textContent=text;next.className=el.classList.contains('name-ln')?'buy-name roll-new':'buy-price roll-new';if(old){old.className=el.classList.contains('name-ln')?'buy-name roll-old':'buy-price roll-old';setTimeout(()=>old.remove(),630)}el.append(next)}
    function updateBuy(item,animate=true){roll($('.name-ln'),item.n);roll($('.price-ln'),'$'+item.p+' · ارسال رایگان');$('.color-label').textContent='رنگ · '+item.c[0][0];thumb.style.backgroundPosition=`${item.g[0]}% ${item.g[1]}%`;thumb.style.transform='translateY(0) scale(1)';if(animate&&!prefersReduced){thumb.animate([{transform:'translateY(70%) scale(.8)'},{transform:'translateY(0) scale(1)'}],{duration:650,easing:'cubic-bezier(.2,.8,.2,1)'});}$('.dots').innerHTML=item.c.map((c,i)=>`<button class="dot ${i===0?'active':''}" style="background:${c[1]}" aria-label="${c[0]}" data-color="${c[0]}"></button>`).join('');$$('.dot').forEach(dot=>dot.addEventListener('click',()=>{$$('.dot').forEach(d=>d.classList.remove('active'));dot.classList.add('active');roll($('.color-label'),'رنگ · '+dot.dataset.color)}));}
    function tryOn(index){if(shown===index)return;shown=index;const item=ITEMS[index];updateBuy(item,true);if(prefersReduced){$('#mCur').style.visibility='visible';$('#mCur').style.backgroundPositionX=item.m+'%';$('#mNext').style.backgroundPositionX=item.m+'%';return}const next=$('#mNext'),old=$('#mCur'),grid=$('.grid'),scan=$('.scan');next.style.backgroundPositionX=item.m+'%';next.style.visibility='visible';const a=next.animate([{clipPath:'inset(0 0 100% 0)'},{clipPath:'inset(0 0 0% 0)'}],{duration:950,easing:'cubic-bezier(.65,0,.35,1)',fill:'forwards'});const b=grid.animate([{clipPath:'inset(0 0 100% 0)'},{clipPath:'inset(0 0 0 0)',offset:.5},{clipPath:'inset(100% 0 0 0)'}],{duration:1092,fill:'forwards'});const c=scan.animate([{top:'0%',transform:'scaleX(.2)',opacity:0},{top:'6%',transform:'scaleX(1)',opacity:1,offset:.08},{top:'94%',transform:'scaleX(1)',opacity:1,offset:.92},{top:'100%',transform:'scaleX(.2)',opacity:0}],{duration:950,easing:'cubic-bezier(.65,0,.35,1)',fill:'forwards'});next.animate([{transform:'scale(1.012)'},{transform:'scale(1)'}],{duration:1250,easing:'ease-out',fill:'forwards'});a.finished.then(()=>{old.style.backgroundPositionX=item.m+'%';old.style.visibility='visible';old.style.clipPath='none';next.style.visibility='hidden';next.style.clipPath='inset(0 0 100% 0)';a.cancel();b.cancel();c.cancel();grid.style.clipPath='inset(0 0 100% 0)';scan.style.opacity=0}).catch(()=>{});}
    function step(dir){target+=dir}
    function setCursor(mode){cur.classList.remove('try','drag','btn');if(mode)cur.classList.add(mode)}
    stage.addEventListener('pointermove',e=>{tx=e.clientX;ty=e.clientY;if(dragging){dx=e.clientX-p0;const now=performance.now();velocity=(e.clientX-lastX)/(now-lastT||1);lastX=e.clientX;lastT=now;pos=target-dx/(xTable()[1]||innerWidth*.2);target=pos} });
    stage.addEventListener('pointerdown',e=>{dragging=true;p0=e.clientX;dx=0;lastX=e.clientX;lastT=performance.now();velocity=0;stage.setPointerCapture(e.pointerId);cur.classList.add('down');setCursor('drag')});
    stage.addEventListener('pointerup',e=>{if(!dragging)return;dragging=false;cur.classList.remove('down');if(Math.abs(dx)<6){target=Math.round(target)}else target=Math.round(target-velocity*3.2*(xTable()[1]/100));setCursor('drag')});stage.addEventListener('pointercancel',()=>{dragging=false;cur.classList.remove('down')});stage.addEventListener('pointermove',e=>{if(!dragging&&e.target===stage)setCursor('drag')});
    stage.addEventListener('wheel',e=>{e.preventDefault();wheelSum+=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;const now=performance.now();if(Math.abs(wheelSum)>60&&now-lastWheel>260){step(wheelSum>0?1:-1);wheelSum=0;lastWheel=now}},{passive:false});
    addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowUp')step(-1);if(e.key==='ArrowRight'||e.key==='ArrowDown')step(1)});
    $('.arrow.left').addEventListener('click',()=>step(-1));$('.arrow.right').addEventListener('click',()=>step(1));$$('.size').forEach(s=>s.addEventListener('click',()=>{$$('.size').forEach(x=>x.classList.remove('active'));s.classList.add('active')}));
    const showToast=message=>{const toast=$('.toast');toast.textContent=message;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2200)};$('.buy-cta').addEventListener('click',()=>showToast('محصول به سبد شما اضافه شد'));$('.buy-cta').addEventListener('mouseenter',()=>setCursor('btn'));$('.buy-cta').addEventListener('mouseleave',()=>setCursor('drag'));$$('.rail button').forEach((button,i)=>button.addEventListener('click',()=>{if(i===0){target=target;showToast('حالت پرو فعال است')}if(i===1)showToast('محصول فعال آماده‌ی خرید است');if(i===2)showToast('مجموعه‌ی جدید مارک به‌زودی');if(i===3)showToast('پروفایل مهمان')}));
    $$('.tab').forEach((tab,i)=>tab.addEventListener('click',()=>{$$('.tab').forEach(t=>t.classList.remove('active'));tab.classList.add('active');const pill=$('.tabs .pill');pill.style.width=tab.offsetWidth+'px';pill.style.transform=`translateX(${tab.offsetLeft-5}px)`;target+=5}));
    addEventListener('pointermove',e=>{if(e.pointerType==='mouse'){cur.style.left=e.clientX+'px';cur.style.top=e.clientY+'px'}});addEventListener('resize',setCW);
    const initialItem=mod(Number(new URLSearchParams(location.search).get('item')||0),5);target=initialItem;setCW();makeCards();requestAnimationFrame(frame);requestAnimationFrame(()=>{const a=$('.tab.active');$('.tabs .pill').style.width=a.offsetWidth+'px';$('.tabs .pill').style.transform=`translateX(${a.offsetLeft-5}px)`});setTimeout(()=>tryOn(initialItem),300);setTimeout(()=>$('.hint').style.opacity=.3,5000);
  </script>
</body>
